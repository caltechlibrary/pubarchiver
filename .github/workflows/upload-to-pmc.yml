name: Upload to PMC

# Packages microPublication Biology articles for PubMed Central (PMC) and
# uploads them to PMC's FTP server, one ZIP file per article.
#
# Each run selects the articles published since the last run, plus the
# articles listed in .github/state/upload-to-pmc/last-failures, and leaves
# out those listed in .github/state/upload-to-pmc/sent.  Every article that
# pubarchiver packages without errors is uploaded, even when others fail.
# The DOIs of articles that were uploaded are added to "sent", and every
# selected article that was not uploaded goes in "last-failures" for the
# next run to try again.  The run then fails, so that someone looks at the
# reasons, which are in the email report.
#
# A manual run can start from a given date, and can resend articles already
# sent.
#
# Required configuration
# vars:
#   PMC_FTP_ADDRESS     # FTP/SFTP endpoint for PMC uploads (e.g., ftp://ftp-private.ncbi.nlm.nih.gov/)
#   EMAIL_SUCCESS       # comma-separated recipients for success mail
#   EMAIL_FAILURE       # comma-separated recipients for failure mail
#   MAILGUN_DOMAIN      # Mailgun domain (used by .github/scripts/mailgun.sh)
#   SLACK_CHANNEL       # Slack channel ID for notifications (used by .github/scripts/slack.sh)
# secrets:
#   PMC_USER            # PMC FTP username
#   PMC_PASS            # PMC FTP password
#   MAILGUN_API_KEY     # Mailgun API key (used by .github/scripts/mailgun.sh)
#   SLACK_CLI_TOKEN     # Slack CLI token (used by .github/scripts/slack.sh)

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      datestamp:
        description: 'YYYY-MM-DD to override last run date'
        required: false
        type: string
      resend:
        description: 'Resend articles that were already sent'
        required: false
        type: boolean
        default: false

concurrency:
  group: upload-to-pmc
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PMC_FTP_ADDRESS: ${{ vars.PMC_FTP_ADDRESS || 'ftp://ftp-private.ncbi.nlm.nih.gov/' }}
      STATE_DIR: .github/state/upload-to-pmc
      RESEND: ${{ github.event_name == 'workflow_dispatch' && inputs.resend && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v6

    - name: Validate required config
      env:
        EMAIL_SUCCESS: ${{ vars.EMAIL_SUCCESS }}
        EMAIL_FAILURE: ${{ vars.EMAIL_FAILURE }}
        MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
        SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
        PMC_USER: ${{ secrets.PMC_USER }}
        PMC_PASS: ${{ secrets.PMC_PASS }}
        MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        SLACK_CLI_TOKEN: ${{ secrets.SLACK_CLI_TOKEN }}
      run: |
        missing=()
        for v in PMC_FTP_ADDRESS EMAIL_SUCCESS EMAIL_FAILURE MAILGUN_DOMAIN SLACK_CHANNEL PMC_USER PMC_PASS MAILGUN_API_KEY SLACK_CLI_TOKEN; do
          if [[ -z "${!v:-}" ]]; then
            missing+=("$v")
          fi
        done
        if (( ${#missing[@]} > 0 )); then
          echo "Missing required configuration: ${missing[*]}" >&2
          exit 1
        fi

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Read the date stamp from the previous run
      env:
        DATESTAMP: ${{ github.event.inputs.datestamp }}
      run: |
        if [[ -n "${DATESTAMP:-}" && ! $DATESTAMP =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "Warning: datestamp '$DATESTAMP' is not in YYYY-MM-DD format. Using the last run date."
          DATESTAMP=''
        fi
        if [[ -n "${DATESTAMP:-}" ]]; then
          AFTER_DATE="$DATESTAMP"
        elif [[ -f "$STATE_DIR/last-run-date" ]]; then
          # Go back one day to include the last run date itself.
          AFTER_DATE=$(date -d "$(cat "$STATE_DIR/last-run-date") -1 days" +"%Y-%m-%d")
        else
          AFTER_DATE=1900-01-01
        fi
        echo "AFTER_DATE=$AFTER_DATE" >> "$GITHUB_ENV"
        echo "TODAY=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

    - name: Create artifact directory
      run: |
        ARTIFACT_DIR="$RUNNER_TEMP/$(date +%Y-%m-%d-%H%M)"
        mkdir -p "$ARTIFACT_DIR"
        echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

    - name: Select articles
      run: |
        set -o pipefail
        bash .github/scripts/select-articles.sh "$STATE_DIR" "$AFTER_DATE" \
             "$ARTIFACT_DIR/selected.txt" | tee -a "$GITHUB_ENV"

    - name: Run pubarchiver on the selected articles
      run: |
        set -uo pipefail
        echo "=== Articles published after $AFTER_DATE: $PUBLISHED_COUNT, already sent: $ALREADY_SENT_COUNT, retried: $RETRY_COUNT, selected: $SELECTED_COUNT ===" \
          | tee "$ARTIFACT_DIR/run.log"
        status=0
        if [[ $SELECTED_COUNT -gt 0 ]]; then
          # Without set +e, the shell's -e would end the step as soon as
          # pubarchiver reports a problem with an article.
          set +e
          pubarchiver -j micropublication -d pmc -C -f "$ARTIFACT_DIR/selected.txt" \
                      -o "$ARTIFACT_DIR" -r "$ARTIFACT_DIR/report" \
                      -s csv,html -t "$TODAY" -@ "$ARTIFACT_DIR/debug.log" 2>&1 | tee -a "$ARTIFACT_DIR/run.log"
          status=${PIPESTATUS[0]}
          set -e
          # 100 and above means some articles had problems; those are
          # counted from the report.
          if (( status >= 100 )); then
            status=0
          fi
        fi
        echo "PUBARCHIVER_STATUS=$status" >> "$GITHUB_ENV"

    - name: Upload to PMC FTP
      if: ${{ env.PUBARCHIVER_STATUS == '0' }}
      env:
        PMC_USER: ${{ secrets.PMC_USER }}
        PMC_PASS: ${{ secrets.PMC_PASS }}
      run: |
        set -uo pipefail
        : > "$ARTIFACT_DIR/sent.txt"
        : > "$ARTIFACT_DIR/upload-failed.txt"
        if [[ -f "$ARTIFACT_DIR/report.csv" ]]; then
          grep '^complete,' "$ARTIFACT_DIR/report.csv" | cut -d, -f2 > "$ARTIFACT_DIR/complete.txt" || true
        else
          : > "$ARTIFACT_DIR/complete.txt"
        fi
        while read -r doi; do
          zip=$(ls "$ARTIFACT_DIR"/micropublication-org/*-"${doi#*/}".zip 2>/dev/null | head -1)
          if [[ -z $zip ]]; then
            echo "No ZIP file for $doi" | tee -a "$ARTIFACT_DIR/run.log"
            echo "$doi" >> "$ARTIFACT_DIR/upload-failed.txt"
            continue
          fi
          echo "=== Uploading $(basename "$zip") ===" | tee -a "$ARTIFACT_DIR/run.log"
          if curl -sS --retry 5 --user "$PMC_USER:$PMC_PASS" -T "$zip" "$PMC_FTP_ADDRESS" \
                  2>&1 | tee -a "$ARTIFACT_DIR/run.log"; then
            echo "$doi" >> "$ARTIFACT_DIR/sent.txt"
            rm -f "$zip"
          else
            echo "$doi" >> "$ARTIFACT_DIR/upload-failed.txt"
          fi
        done < "$ARTIFACT_DIR/complete.txt"
        echo "SENT_COUNT=$(wc -l < "$ARTIFACT_DIR/sent.txt" | tr -d ' ')" >> "$GITHUB_ENV"
        echo "UPLOAD_FAILURES=$(wc -l < "$ARTIFACT_DIR/upload-failed.txt" | tr -d ' ')" >> "$GITHUB_ENV"

    - name: Update state files
      if: ${{ env.PUBARCHIVER_STATUS == '0' }}
      run: |
        bash .github/scripts/record-state.sh "$STATE_DIR" "$ARTIFACT_DIR/selected.txt" \
             "$ARTIFACT_DIR/sent.txt" "$TODAY" | tee -a "$ARTIFACT_DIR/run.log"
        cp "$STATE_DIR/last-failures" "$ARTIFACT_DIR/not-sent.txt"
        echo "NOT_SENT_COUNT=$(wc -l < "$STATE_DIR/last-failures" | tr -d ' ')" >> "$GITHUB_ENV"

    - name: Commit updated state files
      if: ${{ env.PUBARCHIVER_STATUS == '0' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin ${{ github.ref }}
        git add "$STATE_DIR/last-run-date" "$STATE_DIR/last-failures" "$STATE_DIR/sent"
        git diff --cached --quiet || git commit -m "🤖 update upload-to-pmc state files"
        git push origin HEAD:${{ github.ref }}

    - name: Set email variables
      if: always()
      env:
        EMAIL_FAILURE: ${{ vars.EMAIL_FAILURE }}
        EMAIL_SUCCESS: ${{ vars.EMAIL_SUCCESS }}
      run: |
        bash .github/scripts/run-summary.sh PMC "$ARTIFACT_DIR" >> "$GITHUB_ENV"

    - name: Send email report
      if: always()
      env:
        MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
      run: |
        bash .github/scripts/mailgun.sh "$ARTIFACT_DIR"

    - name: Install slack-cli
      if: always()
      run: |
        git clone --depth 1 https://github.com/caltechlibrary/slack-cli "$RUNNER_TEMP/slack-cli"
        echo "$RUNNER_TEMP/slack-cli/src" >> "$GITHUB_PATH"

    - name: Post to Slack
      if: always()
      env:
        SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
        SLACK_CLI_TOKEN: ${{ secrets.SLACK_CLI_TOKEN }}
        RUN_NAME: "PMC upload for micropublication.org"
        PUBARCHIVER_STATUS: ${{ env.PUBARCHIVER_STATUS || 'not run' }}
        VALIDATION_ERRORS: ${{ env.NOT_SENT_COUNT || '0' }}
      run: |
        bash .github/scripts/slack.sh "$ARTIFACT_DIR"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        path: ${{ env.ARTIFACT_DIR }}
        compression-level: 9

    - name: Fail if pubarchiver errored
      if: ${{ env.PUBARCHIVER_STATUS != '0' }}
      run: |
        echo "pubarchiver exited with status ${PUBARCHIVER_STATUS:-unknown}" >&2
        exit 1

    - name: Fail if any article was not sent
      if: ${{ env.PUBARCHIVER_STATUS == '0' && env.NOT_SENT_COUNT != '0' }}
      run: |
        echo "Articles not sent: ${NOT_SENT_COUNT}. They are listed in $STATE_DIR/last-failures and will be tried again on the next run." >&2
        exit 1
